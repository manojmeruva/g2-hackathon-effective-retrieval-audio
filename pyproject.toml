[project]
name = "audio-retrieval"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper",
    "pyannote.audio",
    "sentence-transformers",
    "sqlalchemy>=2.0",
    "psycopg[binary]",
    "pgvector",
    "pydantic>=2.0",
    "typer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: uses real models or services; slower and may download model weights"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "pyannote.core.*"]
ignore_missing_imports = true
