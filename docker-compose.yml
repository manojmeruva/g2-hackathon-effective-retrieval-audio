services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: audio
      POSTGRES_PASSWORD: audio
      POSTGRES_DB: audio_retrieval
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audio -d audio_retrieval"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
